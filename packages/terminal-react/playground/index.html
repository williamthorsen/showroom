<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>terminal-react playground</title>
    <style>
      :root {
        --page-text: #1f2328;
        --page-surface: #ffffff;
        --page-border: #8c959f;
        --page-hover: #eaeef2;
        --terminal-react-focus: #3b82f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-text: #e6edf3;
          --page-surface: #0d1117;
          --page-border: #8c959f;
          --page-hover: #262c36;
        }
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        background-color: var(--page-surface);
        color: var(--page-text);
        font-family: system-ui, sans-serif;
        font-size: 1rem;
      }
      main {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        max-width: 60rem;
        margin-inline: auto;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      button {
        padding: 0.5rem 0.875rem;
        border: 1px solid var(--page-border);
        border-radius: 6px;
        background-color: var(--page-surface);
        color: var(--page-text);
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background-color: var(--page-hover);
      }
      button:focus-visible {
        outline: 2px solid var(--terminal-react-focus);
        outline-offset: 2px;
      }
      .frame {
        width: 40rem;
        max-width: 100%;
        height: 20rem;
        min-width: 10rem;
        min-height: 5rem;
        overflow: hidden;
        resize: both;
        border: 1px solid var(--page-border);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
